<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lyrics Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #fceabb, #f8b500);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      padding: 40px 20px;
      min-height: 100vh;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
      color: #222;
    }

    input {
      padding: 12px 15px;
      margin: 10px;
      width: 280px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: 0.3s;
    }

    input:focus {
      border-color: #f39c12;
      outline: none;
    }

    button {
      padding: 12px 25px;
      background-color: #f39c12;
      border: none;
      color: white;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #e67e22;
    }

    pre {
      white-space: pre-wrap;
      background-color: #fff;
      padding: 20px;
      margin-top: 30px;
      border-radius: 10px;
      max-width: 90%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      text-align: left;
      color: #444;
    }

    @media (max-width: 600px) {
      input {
        width: 90%;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <h1>🎵 Şarkı Sözü Bulucu</h1>

  <input type="text" id="artist" placeholder="Sanatçı Adı">
  <input type="text" id="song" placeholder="Şarkı Adı">
  <button onclick="getLyrics()">Sözleri Getir</button>

  <pre id="lyrics">Burada şarkı sözleri görünecek...</pre>

  <script>
    function getLyrics() {
      const artist = document.getElementById('artist').value;
      const song = document.getElementById('song').value;

      if (!artist || !song) {
        alert("Lütfen sanatçı ve şarkı adı girin.");
        return;
      }

      const url = `https://api.lyrics.ovh/v1/${artist}/${song}`;
      fetch(url)
        .then(response => response.json())
        .then(data => {
          if (data.lyrics) {
            document.getElementById('lyrics').textContent = data.lyrics;
          } else {
            document.getElementById('lyrics').textContent = "Şarkı sözü bulunamadı.";
          }
        })
        .catch(error => {
          console.error(error);
          document.getElementById('lyrics').textContent = "Bir hata oluştu.";
        });
    }
  </script>

</body>
</html>
